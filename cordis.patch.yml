# ============================================================================
# dsh-ningning-widget —— DSH bundle patch
# ============================================================================
# 这是插件的"挂载声明"。DSH 启动时按 bundle 层栈叠加各插件的 patch，
# 本文件会把宁宁余额挂件插入 Web profile 的配置树。
#
# 安装方式（无需手工复制 / 手工改 profile patch）：
#   dsh plugin --profile web add dsh-ningning-widget
# 或本地开发安装：
#   dsh plugin --profile web add link:<本目录绝对路径>
# ============================================================================

- insert:
    - id: dsh-ningning-widget
      name: dsh-ningning-widget
